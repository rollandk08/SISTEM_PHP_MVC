name: PHP MVC checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: MariaDB nativo en base temporal, sin Docker
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server mariadb-client
          mariadb-install-db --datadir="$RUNNER_TEMP/northwind-db" --auth-root-authentication-method=normal --skip-test-db
          mariadbd --no-defaults --datadir="$RUNNER_TEMP/northwind-db" --socket="$RUNNER_TEMP/northwind.sock" --pid-file="$RUNNER_TEMP/northwind.pid" --port=3307 --bind-address=127.0.0.1 --log-error="$RUNNER_TEMP/northwind-db.log" &
          for attempt in $(seq 1 30); do
            if mariadb-admin --host=127.0.0.1 --port=3307 --user=root ping --silent; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/northwind-db.log"
          exit 1
      - name: Configure isolated environment
        shell: bash
        run: |
          cp config/environments/testing.env.example .env.testing
          echo 'DB_PORT=3307' >> .env.testing
          php -r 'echo "APP_KEY=".bin2hex(random_bytes(32)).PHP_EOL;' >> .env.testing
      - run: php tools/console.php install
        env:
          APP_ENV_FILE: .env.testing
      - run: composer lint
      - run: php vendor/bin/phpunit --log-junit build/phpunit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-${{ matrix.php }}
          path: build/phpunit.xml
      - name: Cerrar MariaDB temporal
        if: always()
        run: mariadb-admin --host=127.0.0.1 --port=3307 --user=root shutdown || true
