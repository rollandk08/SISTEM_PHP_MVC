# Ejemplo de vhost localhost, adaptar ruta en otro servidor.
<VirtualHost 127.0.0.1:80>
    ServerName northwind.local
    DocumentRoot "C:/xampp/htdocs/SISTEM_PHP_MVC/public"
    <Directory "C:/xampp/htdocs/SISTEM_PHP_MVC/public">
        Options -Indexes
        AllowOverride All
        Require local
    </Directory>
    <Directory "C:/xampp/htdocs/SISTEM_PHP_MVC/storage">
        Require all denied
    </Directory>
    ErrorLog "logs/northwind-error.log"
    CustomLog "logs/northwind-access.log" combined
</VirtualHost>
